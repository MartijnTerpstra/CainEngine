name: Unit tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: CainEngine unit tests (Windows, Debug)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Dependencies/{mst,Abseil,googletest,nlohmann_json} are real git
          # submodules (see .gitmodules) - nothing under Dependencies/ is
          # vendored/committed directly, so this is required for the configure
          # step below to have anything to build.
          submodules: recursive

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Configure
        # ci-windows-debug (CMakePresets.json) pins BUILD_TESTING=ON on this
        # initial configure call, not added later - Dependencies/CMakeLists.txt
        # only add_subdirectory()s googletest while BUILD_TESTING is already
        # true, and nothing earlier in the configure sets it by default.
        #
        # Debug specifically (not Release): Release adds /EHs-c- to
        # CMAKE_CXX_FLAGS_RELEASE (see top-level CMakeLists.txt), which
        # disables C++ exception handling at the compiler level. The test
        # suite's FatalErrorTest fixture (Common/TestSupport) relies on being
        # able to throw/catch, so it (and by extension anything using it)
        # only works in a Debug build.
        run: cmake --preset ci-windows-debug

      - name: Build test targets
        run: cmake --build --preset ci-windows-debug

      - name: Run tests
        run: ctest --preset ci-windows-debug

  test-linux:
    name: CainEngine unit tests (Linux, Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Dependencies/{mst,Abseil,googletest,nlohmann_json} are real git
          # submodules (see .gitmodules) - nothing under Dependencies/ is
          # vendored/committed directly, so this is required for the configure
          # step below to have anything to build.
          submodules: recursive

      - name: Install build dependencies
        # Ninja for the ci-linux-debug preset; libx11-dev, libxrandr-dev and
        # libvulkan-dev because the top-level CMakeLists.txt always
        # add_subdirectory()s Platform.Linux (find_package(X11) REQUIRED,
        # X11_Xrandr_FOUND REQUIRED - see Platform.Linux/CMakeLists.txt) and
        # Graphics.Vulkan (find_package(Vulkan), FATAL_ERROR if missing) on
        # UNIX, even though the test suite itself only exercises
        # Common/EntitySystem. pkg-config, libwayland-dev, wayland-protocols
        # and libxkbcommon-dev are for Platform.Linux's Wayland backend
        # (WaylandMonitor/WaylandWindow): wayland-client + wayland-scanner +
        # the xdg-shell.xml it generates client bindings from, plus XKB
        # keymap handling.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libvulkan-dev \
            pkg-config libwayland-dev wayland-protocols libxkbcommon-dev

      - name: Configure
        # ci-linux-debug (CMakePresets.json) pins BUILD_TESTING=ON, same as
        # ci-windows-debug. Debug specifically - see the comment on the
        # Windows job's Configure step; Release disables exceptions, which
        # the FatalErrorTest fixture (Common/TestSupport) relies on.
        run: cmake --preset ci-linux-debug

      - name: Build test targets
        run: cmake --build --preset ci-linux-debug

      - name: Run tests
        run: ctest --preset ci-linux-debug
